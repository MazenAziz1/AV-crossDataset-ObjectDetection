# YOLOv8s Training Configuration
# Status: Frozen
# Slot: A | Framework: Ultralytics | Hardware: NVIDIA T4 16GB

metadata:
  milestone: 4
  step: 11
  status: frozen
  date_frozen: "2026-08-11"

model:
  family: "yolo"
  name: "yolov8s"
  architecture: "YOLOv8-Small"
  framework: "ultralytics"
  pretrained_weights: "yolov8s.pt"
  input_size: [640, 640]
  num_classes: 3
  class_mapping:
    0: "Vehicle"
    1: "Pedestrian"
    2: "Cyclist"

slot:
  assignment: "slot_a"
  role: "primary"

training:
  target_epochs: 200
  early_stopping_patience: 20
  batch_size: 32
  effective_batch_size: 32
  dataloader_workers: 4
  amp: true

  optimizer:
    name: "auto"
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3
    warmup_momentum: 0.8
    warmup_bias_lr: 0.1

augmentation:
  config: "configs/datasets/milestone_3/augmentation.yaml"

vram:
  target_hardware: "NVIDIA Tesla T4 16GB"
  expected_gpu_memory_mb: 5500
  mitigations:
    - "automatic_mixed_precision_amp_true"

run_types:
  tiny_overfit:
    epochs: 5
    subset_size: 10
    description: "Verify loss decreases to near-zero"
  pilot:
    epochs: 10
    description: "Check memory, epoch time, loss stability"
  final:
    epochs: 200
    description: "Full training with early stopping"
